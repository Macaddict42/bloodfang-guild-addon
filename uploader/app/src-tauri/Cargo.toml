[package]
name = "guild-uploader-app"
version = "0.1.1"
description = "Desktop uploader and addon updater. Files only; never touches the game process."
authors = ["raid group"]
edition = "2021"
rust-version = "1.90"
default-run = "guild-uploader-app"

[lib]
name = "guild_uploader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "guild-uploader-app"
path = "src/main.rs"

[[bin]]
name = "updater"
path = "src/bin/updater.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
guild-uploader-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "6"
notify-debouncer-mini = "0.4"
dirs = "5"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
semver = "1"
opener = "0.7"
ring = "0.17.14"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
