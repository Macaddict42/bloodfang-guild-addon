[package]
name = "guild-uploader-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Reads the guild addon's SavedVariables and uploads its export strings to the guild site. Never touches the game process."

[lib]
path = "src/lib.rs"

[[bin]]
name = "guild-uploader"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# TLS is checked by the operating system's verifier and trust store (see src/http.rs).
# ring is the crypto provider ureq already uses; no aws-lc or OpenSSL runtime is added.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
getrandom = "0.2"
socket2 = "0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
semver = "1"
tempfile = "3"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }
