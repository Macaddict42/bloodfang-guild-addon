[package]
name = "guild-uploader-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Reads the guild addon's SavedVariables and uploads its export strings to the guild site. Never touches the game process."

[lib]
path = "src/lib.rs"

[[bin]]
name = "guild-uploader"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
semver = "1"
tempfile = "3"
