name: addon release
on:
  push:
    tags: ["addon-v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests (Lua 5.1 and LuaJIT)
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q lupa==2.4 pillow==11.0.0
          /tmp/v/bin/python tests/run.py
          PATH=/tmp/v/bin:$PATH sh tests/package-check.sh
      - name: No branding
        env: { BRANDING_WORDS: "${{ secrets.BRANDING_WORDS }}" }
        run: scripts/check-no-branding.sh
      - name: Build zip
        env:
          ADDON_NAME: ${{ vars.ADDON_NAME }}
          ADDON_TITLE: ${{ vars.ADDON_TITLE }}
          ADDON_INTERFACE: ${{ vars.ADDON_INTERFACE }}
          ADDON_SLASH: ${{ vars.ADDON_SLASH }}
          ADDON_ICON: ${{ vars.ADDON_ICON }}
        run: PATH=/tmp/v/bin:$PATH scripts/build-addon.sh "${GITHUB_REF_NAME#addon-v}"
      - name: SHA256SUMS
        run: cd dist && cat *.sha256 > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*.zip" }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/SHA256SUMS --title "Addon ${GITHUB_REF_NAME#addon-v}" --notes "SHA-256 is in SHA256SUMS. Verify provenance with: gh attestation verify <zip> --repo ${{ github.repository }}"
