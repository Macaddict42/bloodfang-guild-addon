name: uploader-app
on:
  push:
    tags: ["uploader-app-v*"]
  workflow_dispatch:
    inputs:
      make_draft:
        description: "Also create a draft prerelease (delete afterwards for smoke builds)"
        type: boolean
        default: false
      version:
        description: "Version used in artifact names for a manual build (e.g. 0.1.2). Empty uses 0.1.0-ci.N."
        type: string
        default: ""
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/uploader-app-build.yml
    with:
      version: ${{ inputs.version || '' }}

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }

  release:
    if: startsWith(github.ref, 'refs/tags/uploader-app-v') || inputs.make_draft
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Both platforms built
        run: |
          set -euo pipefail
          ls -la dist
          win=$(find dist -maxdepth 1 -name '*-windows-*.exe' | wc -l)
          mac=$(find dist -maxdepth 1 -name '*-macos-*.dmg' | wc -l)
          macapp=$(find dist -maxdepth 1 -name '*-macos-*.app.tar.gz' | wc -l)
          echo "windows installers: $win, macOS disk images: $mac, macOS app archives: $macapp"
          if [ "$win" -lt 1 ] || [ "$mac" -lt 1 ] || [ "$macapp" -lt 1 ]; then
            echo "A release needs the Windows installer, the macOS disk image and the macOS app archive (used by Update now)." >&2
            exit 1
          fi
      - name: SHA256SUMS
        run: cd dist && cat *.sha256 > SHA256SUMS && rm -f *.sha256 && cat SHA256SUMS
      - name: Publish draft (tag) or CI draft
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          NOTES="Draft. Sign both installers with scripts/uploader-sign-release.sh, then publish. Verify SHA256SUMS and provenance: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          if [[ "$GITHUB_REF" == refs/tags/uploader-app-v* ]]; then
            # A release published with update-key-signed assets must not be replaced by this CI build.
            # It still has to carry both platforms, each with its signature.
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
              echo "$names"
              ok=1
              for pat in '-windows-.*\.exe$' '-windows-.*\.exe\.sig$' '-macos-.*\.dmg$' '-macos-.*\.dmg\.sig$' '-macos-.*\.app\.tar\.gz$' '-macos-.*\.app\.tar\.gz\.sig$'; do
                echo "$names" | grep -Eq -- "$pat" || { echo "Release $GITHUB_REF_NAME is missing an asset matching $pat" >&2; ok=0; }
              done
              [ "$ok" = 1 ] || exit 1
              echo "Release $GITHUB_REF_NAME already exists with both platforms; leaving its assets unchanged."
              exit 0
            fi
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Uploader app ${GITHUB_REF_NAME#uploader-app-v}" --notes "$NOTES" --draft
          else
            TAG="uploader-app-ci-${GITHUB_RUN_NUMBER}"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Uploader app CI draft ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --draft --prerelease
          fi
