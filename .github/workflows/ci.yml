name: ci
# PR checks. Each area runs only when its files change; ci-ok is the single required check
# and counts skipped jobs as passed. See docs/workflow/05-verification.md section 3.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      addon: ${{ github.event_name != 'pull_request' || steps.f.outputs.addon == 'true' }}
      core: ${{ github.event_name != 'pull_request' || steps.f.outputs.core == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.f.outputs.ui == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.f.outputs.app == 'true' }}
      native: ${{ steps.f.outputs.native == 'true' || contains(github.event.pull_request.labels.*.name, 'native-build') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            addon: ['addon/**', 'tests/**', 'contract/**', 'scripts/build-addon.sh', '.github/workflows/addon-checks.yml', '.github/workflows/ci.yml']
            core: ['uploader/core/**', 'uploader/Cargo.*', 'contract/**', '.github/workflows/ci.yml']
            ui: ['uploader/app/ui/**', 'contract/golden/uploader/**', '.github/workflows/ci.yml']
            app: ['uploader/app/src-tauri/**', 'uploader/Cargo.*', 'uploader/core/**', '.github/workflows/ci.yml']
            native: ['uploader/app/**', 'uploader/core/**', 'uploader/Cargo.*', '.github/workflows/uploader-app-build.yml']

  branding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Fork PRs get no secrets, so the script skips; it runs again on push to main.
      - name: No branding
        env: { BRANDING_WORDS: "${{ secrets.BRANDING_WORDS }}" }
        run: scripts/check-no-branding.sh

  addon:
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    uses: ./.github/workflows/addon-checks.yml

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: uploader } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "uploader -> target", key: core }
      - run: cargo test -p guild-uploader-core --locked

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: uploader/app/ui
        run: node --test

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: uploader } }
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "uploader -> target", key: app }
      - run: cargo test -p guild-uploader-app --locked

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/uploader-app-build.yml

  ci-ok:
    if: always()
    needs: [changes, branding, addon, core, ui, app, native]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job ended with '$r'"; exit 1 ;; esac
          done
          {
            echo "### ci"
            echo "| job | result |"; echo "|---|---|"
            python3 -c 'import json,os; [print("| %s | %s |" % (k, v["result"])) for k, v in json.loads(os.environ["NEEDS"]).items()]'
          } >> "$GITHUB_STEP_SUMMARY"
